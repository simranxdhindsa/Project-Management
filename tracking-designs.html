<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sprint Tracking — 10 Designs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#080A10;color:#E2E8F0;min-height:100vh}

/* ── DESIGN PICKER ── */
.picker{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(5,7,12,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.07);
  padding:0 20px;height:52px;
  display:flex;align-items:center;gap:8px;overflow-x:auto;
}
.picker::-webkit-scrollbar{display:none}
.pick-label{font-size:11px;font-weight:700;color:#4A5568;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;margin-right:4px}
.pbtn{
  padding:5px 14px;border-radius:7px;font-size:12px;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);
  color:#94A3B8;transition:all 150ms;white-space:nowrap;flex-shrink:0;
}
.pbtn:hover{color:#E2E8F0;border-color:rgba(255,255,255,.15)}
.pbtn.on{color:#fff;border-color:var(--accent,#6366F1);background:rgba(99,102,241,.15)}

/* ── DESIGN SECTIONS ── */
.design{display:none;padding-top:52px;min-height:100vh}
.design.on{display:block}

/* ════════════════════════════════════════════════════
   SHARED COMPONENTS (overridden per theme)
════════════════════════════════════════════════════ */
.d-wrap{padding:20px 24px;max-width:1300px;margin:0 auto}
.d-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.d-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.d-tools{display:flex;gap:8px}
.d-btn{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{border-radius:12px;padding:16px 18px}
.kpi-l{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.kpi-v{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.5px}
.kpi-n{font-size:11px;margin-top:5px}
.kpi-bar{height:3px;border-radius:2px;margin-top:10px}
.kpi-bar-f{height:100%;border-radius:2px;width:87%}
.sec-wrap{margin-bottom:14px;border-radius:12px;overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;font-size:13px;font-weight:600}
.sec-dot{width:8px;height:8px;border-radius:50%;margin-right:8px}
.sec-cnt{padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;margin-left:6px}
/* cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;padding:14px}
.card{border-radius:10px;padding:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform 150ms}
.card:hover{transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-id{font-family:'Fira Code',monospace;font-size:11px;font-weight:500}
.card-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:8px}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700}
.card-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding-top:10px}
.stat-l{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.stat-v{font-family:'Fira Code',monospace;font-size:12px;font-weight:600}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.av-n{font-size:12px}
/* blocked strip */
.bl-strip{border-radius:10px;overflow:hidden;margin:0 0 14px}
.bl-row{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;transition:background 150ms}
.bl-id{font-family:'Fira Code',monospace;font-size:11px;width:85px;flex-shrink:0}
.bl-pri{width:44px;flex-shrink:0}
.bl-title{flex:1;font-size:13px;font-weight:500}
.bl-t{font-family:'Fira Code',monospace;font-size:12px;font-weight:600;width:70px;text-align:right;flex-shrink:0}
.bl-av{display:flex;align-items:center;gap:5px;width:100px;flex-shrink:0;justify-content:flex-end}
/* compact table */
.ct{border-radius:10px;overflow:hidden;margin-bottom:14px}
.ct-row{display:grid;grid-template-columns:85px 48px 1fr 80px 80px 120px;align-items:center;padding:9px 16px;gap:8px;cursor:pointer;transition:background 150ms}
.ct-hdr{cursor:default!important}
.ct-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
/* verif */
.vc{padding:2px 5px;border-radius:4px;font-size:10px;font-weight:700}
.vc-d{background:rgba(16,185,129,.15);color:#10B981;border:1px solid rgba(16,185,129,.3)}
.vc-s{background:rgba(59,130,246,.15);color:#3B82F6;border:1px solid rgba(59,130,246,.3)}
.vc-p{background:rgba(168,85,247,.15);color:#A855F7;border:1px solid rgba(168,85,247,.3)}

.d1 .ct-hdr{background:var(--s2)}
.d1 .ct-row:hover{background:var(--s2)}
.d1 .ct-lbl{color:var(--mut)}
.d1 .ct-tid{color:var(--acc)}
.d1 .ct-title{color:var(--txt)}
.d1 .ct-crit{color:var(--red)}
.d1 .ct-warn{color:var(--amb)}
.d1 .ct-dim{color:var(--mut)}
