<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .scanline { animation: scan 1.4s ease-in-out infinite; }
    @keyframes scan { 0%,100% { transform: translateY(-2px); opacity: 0; } 20% { opacity: 1; } 50% { transform: translateY(26px); opacity: 1; } 80% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect x="18" y="20" width="60" height="9" rx="2" fill="url(#g)"/>
  <rect x="18" y="38" width="60" height="9" rx="2" fill="url(#g)" opacity="0.7"/>
  <rect x="18" y="56" width="60" height="9" rx="2" fill="url(#g)" opacity="0.4"/>
  <rect class="scanline" x="18" y="20" width="60" height="3" fill="#a5f3fc"/>
</svg>
